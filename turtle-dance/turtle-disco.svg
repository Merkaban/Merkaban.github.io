path d="M4.4-1.5V-19q6 1.5 8 8" fill="none" stroke="#ff7aa2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(52 196)"><g class="note" style="animation-delay:1.9s"><ellipse rx="5.2" ry="4" transform="rotate(-22)" fill="#3fb6a8"/><path d="M4.4-1.5V-19q6 1.5 8 8" fill="none" stroke="#3fb6a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
