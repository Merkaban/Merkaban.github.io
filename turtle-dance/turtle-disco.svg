<style>
.turtle{transform-origin:120px 212px}.torso{transform-origin:120px 190px}.head{transform-origin:120px 106px}
.eyes{transform-origin:120px 80px;animation:blink 4.3s infinite}.joy{opacity:0}
.arm-l{transform-origin:78px 128px;transform:rotate(20deg)}.arm-r{transform-origin:162px 128px;transform:rotate(-20deg)}
.fore-l{transform-origin:78px 144px;transform:rotate(-10deg)}.fore-r{transform-origin:162px 144px;transform:rotate(10deg)}
.leg-l{transform-origin:105px 184px}.leg-r{transform-origin:135px 184px}.shadow{transform-origin:120px 214px}
.bl,.br{opacity:0}
.spark,.note,.drop,.pop{transform-box:fill-box;transform-origin:center;opacity:0}
.spark{animation:twinkle 2s ease-in-out infinite}.note{animation:float 2.8s ease-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@keyframes float{0%{opacity:0;transform:translate(0,6px) rotate(-12deg)}25%{opacity:1}100%{opacity:0;transform:translate(8px,-36px) rotate(14deg)}}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}}
.turtle{animation:dBob .5s ease-in-out infinite}.torso{animation:dTorso 2s infinite}.head{animation:dHead 2s infinite}
.face{animation:dFace 2s infinite}.arm-r{animation:dPoint 2s infinite}.arm-l{animation:dHip 2s infinite}
.leg-l{animation:dLegL 2s infinite}.leg-r{animation:dLegR 2s infinite}.fore-r{transform:none}.fore-l{transform:rotate(-105deg)}
.ball{transform-origin:192px 0;animation:swing 2s ease-in-out infinite alternate}.lamp{opacity:0;animation:lamp 1.5s ease-in-out infinite}
@keyframes dBob{0%,100%{transform:translate(0px,2px) rotate(0deg) scale(1.03,0.97)}50%{transform:translate(0px,-2px) rotate(0deg) scale(0.99,1.01)}}
@keyframes dPoint{0%,50%,100%{transform:rotate(-138deg);animation-timing-function:ease-out}20%,70%{transform:rotate(-150deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}25%,75%{transform:rotate(36deg);animation-timing-function:ease-out}45%,95%{transform:rotate(44deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}}@keyframes dHip{0%,50%,100%{transform:rotate(58deg);animation-timing-function:ease-out}20%,70%{transform:rotate(60deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}25%,75%{transform:rotate(64deg);animation-timing-function:ease-out}45%,95%{transform:rotate(68deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}}
@keyframes dTorso{0%,50%,100%{transform:rotate(4deg);animation-timing-function:ease-out}20%,70%{transform:rotate(6deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}25%,75%{transform:rotate(-5deg);animation-timing-function:ease-out}45%,95%{transform:rotate(-6deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}}@keyframes dHead{0%,50%,100%{transform:rotate(7deg);animation-timing-function:ease-out}20%,70%{transform:rotate(9deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}25%,75%{transform:rotate(-7deg);animation-timing-function:ease-out}45%,95%{transform:rotate(-9deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}}
@keyframes dFace{0%,50%,100%{transform:translate(3px,-2px);animation-timing-function:ease-out}20%,70%{transform:translate(4px,-2px);animation-timing-function:cubic-bezier(.7,0,.3,1)}25%,75%{transform:translate(-3px,3px);animation-timing-function:ease-out}45%,95%{transform:translate(-4px,3px);animation-timing-function:cubic-bezier(.7,0,.3,1)}}
@keyframes dLegR{0%,50%,100%{transform:rotate(-11deg);animation-timing-function:ease-out}20%,70%{transform:rotate(-13deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}25%,75%{transform:rotate(0deg);animation-timing-function:ease-out}45%,95%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}}@keyframes dLegL{0%,50%,100%{transform:rotate(0deg);animation-timing-function:ease-out}20%,70%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}25%,75%{transform:rotate(6deg);animation-timing-function:ease-out}45%,95%{transform:rotate(8deg);animation-timing-function:cubic-bezier(.7,0,.3,1)}}
@keyframes swing{0%{transform:rotate(-5deg)}100%{transform:rotate(5deg)}}@keyframes lamp{0%,100%{opacity:0}50%{opacity:1}}</style>
