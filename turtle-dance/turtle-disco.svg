<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<title>Turtle dancing: disco</title>
<defs>
<radialGradient id="skin" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#b6ee9f"/><stop offset="1" stop-color="#62bf6f"/></radialGradient>
<radialGradient id="shell" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#5dbb8c"/><stop offset="1" stop-color="#2c7457"/></radialGradient>
<linearGradient id="belly" x2="0" y2="1"><stop offset="0" stop-color="#fff5c8"/><stop offset="1" stop-color="#f4cc76"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff3b0" stop-opacity=".7"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient>
<clipPath id="hc"><ellipse cx="120" cy="76" rx="38" ry="32"/></clipPath><radialGradient id="lp"><stop offset="0" stop-color="#ff6fb1" stop-opacity=".6"/><stop offset="1" stop-color="#ff6fb1" stop-opacity="0"/></radialGradient><radialGradient id="lc"><stop offset="0" stop-color="#4fd0ff" stop-opacity=".6"/><stop offset="1" stop-color="#4fd0ff" stop-opacity="0"/></radialGradient><radialGradient id="ly"><stop offset="0" stop-color="#ffd24d" stop-opacity=".6"/><stop offset="1" stop-color="#ffd24d" stop-opacity="0"/></radialGradient><radialGradient id="chrome" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#c3cddb"/><stop offset="1" stop-color="#76849a"/></radialGradient><clipPath id="bc"><circle cx="192" cy="35" r="15"/></clipPath>
