</defs>
<style>
.turtle{transform-origin:120px 212px}.torso{transform-origin:120px 190px}.head{transform-origin:120px 106px}
.eyes{transform-origin:120px 80px;animation:blink 4.3s infinite}.joy{opacity:0}
.arm-l{transform-origin:78px 128px;transform:rotate(20deg)}.arm-r{transform-origin:162px 128px;transform:rotate(-20deg)}
.fore-l{transform-origin:78px 144px;transform:rotate(-10deg)}.fore-r{transform-origin:162px 144px;transform:rotate(10deg)}
.leg-l{transform-origin:105px 184px}.leg-r{transform-origin:135px 184px}.shadow{transform-origin:120px 214px}
.bl,.br{opacity:0}
.spark,.note,.drop,.pop{transform-box:fill-box;transform-origin:center;opacity:0}
.spark{animation:twinkle 2s ease-in-out infinite}.note{animation:float 2.8s ease-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@keyframes float{0%{opacity:0;transform:translate(0,6px) rotate(-12deg)}25%{opacity:1}100%{opacity:0;transform:translate(8px,-36px) rotate(14deg)}}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}}
.turtle,.arm-l,.arm-r,.fore-l,.fore-r,.head,.face{animation-duration:2.4s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.7,0,.3,1)}
.turtle{animation-name:rT}.arm-l{animation-name:rL}.arm-r{animation-name:rR}.fore-l{animation-name:rLf}.fore-r{animation-name:rRf}
.head{animation-name:rH}.face{animation-name:rF}.bulb{animation:bulb .6s steps(1) infinite}
@keyframes rL{0%{transform:rotate(90deg)}4%{transform:rotate(90deg)}12.5%{transform:rotate(90deg)}16.5%{transform:rotate(90deg)}25%{transform:rotate(90deg)}29%{transform:rotate(90deg)}37.5%{transform:rotate(90deg)}41.5%{transform:rotate(90deg)}50%{transform:rotate(90deg)}54%{transform:rotate(90deg)}62.5%{transform:rotate(90deg)}66.5%{transform:rotate(90deg)}75%{transform:rotate(90deg)}79%{transform:rotate(0deg)}87.5%{transform:rotate(0deg)}91.5%{transform:rotate(90deg)}100%{transform:rotate(90deg)}}@keyframes rLf{0%{transform:rotate(90deg)}4%{transform:rotate(90deg)}12.5%{transform:rotate(90deg)}16.5%{transform:rotate(90deg)}25%{transform:rotate(90deg)}29%{transform:rotate(-90deg)}37.5%{transform:rotate(-90deg)}41.5%{transform:rotate(-90deg)}50%{transform:rotate(-90deg)}54%{transform:rotate(0deg)}62.5%{transform:rotate(0deg)}66.5%{transform:rotate(0deg)}75%{transform:rotate(0deg)}79%{transform:rotate(90deg)}87.5%{transform:rotate(90deg)}91.5%{transform:rotate(90deg)}100%{transform:rotate(90deg)}}
@keyframes rR{0%{transform:rotate(0deg)}4%{transform:rotate(-90deg)}12.5%{transform:rotate(-90deg)}16.5%{transform:rotate(-90deg)}25%{transform:rotate(-90deg)}29%{transform:rotate(-90deg)}37.5%{transform:rotate(-90deg)}41.5%{transform:rotate(-90deg)}50%{transform:rotate(-90deg)}54%{transform:rotate(-90deg)}62.5%{transform:rotate(-90deg)}66.5%{transform:rotate(-180deg)}75%{transform:rotate(-180deg)}79%{transform:rotate(0deg)}87.5%{transform:rotate(0deg)}91.5%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}@keyframes rRf{0%{transform:rotate(-90deg)}4%{transform:rotate(-90deg)}12.5%{transform:rotate(-90deg)}16.5%{transform:rotate(90deg)}25%{transform:rotate(90deg)}29%{transform:rotate(90deg)}37.5%{transform:rotate(90deg)}41.5%{transform:rotate(-90deg)}50%{transform:rotate(-90deg)}54%{transform:rotate(0deg)}62.5%{transform:rotate(0deg)}66.5%{transform:rotate(0deg)}75%{transform:rotate(0deg)}79%{transform:rotate(-90deg)}87.5%{transform:rotate(-90deg)}91.5%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
@keyframes rH{0%{transform:rotate(-8deg)}4%{transform:rotate(0deg)}12.5%{transform:rotate(0deg)}16.5%{transform:rotate(-8deg)}25%{transform:rotate(-8deg)}29%{transform:rotate(0deg)}37.5%{transform:rotate(0deg)}41.5%{transform:rotate(8deg)}50%{transform:rotate(8deg)}54%{transform:rotate(8deg)}62.5%{transform:rotate(8deg)}66.5%{transform:rotate(0deg)}75%{transform:rotate(0deg)}79%{transform:rotate(0deg)}87.5%{transform:rotate(0deg)}91.5%{transform:rotate(-8deg)}100%{transform:rotate(-8deg)}}@keyframes rF{0%{transform:translate(4px,0px)}4%{transform:translate(0px,0px)}12.5%{transform:translate(0px,0px)}16.5%{transform:translate(4px,0px)}25%{transform:translate(4px,0px)}29%{transform:translate(0px,0px)}37.5%{transform:translate(0px,0px)}41.5%{transform:translate(-4px,0px)}50%{transform:translate(-4px,0px)}54%{transform:translate(-4px,0px)}62.5%{transform:translate(-4px,0px)}66.5%{transform:translate(0px,0px)}75%{transform:translate(0px,0px)}79%{transform:translate(0px,0px)}87.5%{transform:translate(0px,0px)}91.5%{transform:translate(4px,0px)}100%{transform:translate(4px,0px)}}
@keyframes rT{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}4%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}12.5%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}16.5%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}25%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}29%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}37.5%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}41.5%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}50%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}54%{transform:translate(-10px,0px) rotate(0deg) scale(1,1)}62.5%{transform:translate(-10px,0px) rotate(0deg) scale(1,1)}66.5%{transform:translate(-10px,0px) rotate(0deg) scale(1,1)}75%{transform:translate(-10px,0px) rotate(0deg) scale(1,1)}79%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}87.5%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}91.5%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1)}}
@keyframes bulb{50%{fill:#ffd166}}</style>
