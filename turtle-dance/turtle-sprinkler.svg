@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}}
.bl{opacity:1}.fl{opacity:0}.arm-l{transform:rotate(165deg)}.fore-l{transform:rotate(74deg)}.fore-r{transform:none}
.face{transform:translate(4px,-1px)}.leg-l{transform:translate(-2px,-5px) rotate(10deg)}
.arm-r{animation:sArm 2.4s infinite}.turtle{animation:sBody 2.4s infinite}.head{animation:sHead 2.4s infinite}
.drop{animation:spray .3s linear infinite}
