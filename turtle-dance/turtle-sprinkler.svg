1)}50%{transform:translate(0px,0px) rotate(0.5999999999999996deg) scale(1,1);animation-timing-function:cubic-bezier(.3,1.7,.6,1)}53%{transform:translate(0px,2px) rotate(1.7999999999999998deg) scale(1,1)}58%{transform:translate(0px,0px) rotate(1.7999999999999998deg) scale(1,1)}62.5%{transform:translate(0px,0px) rotate(1.7999999999999998deg) scale(1,1);animation-timing-function:cubic-bezier(.3,1.7,.6,1)}65.5%{transform:translate(0px,2px) rotate(3deg) scale(1,1)}70.5%{transform:translate(0px,0px) rotate(3deg) scale(1,1)}74%{transform:translate(0px,0px) rotate(3deg) scale(1,1);animation-timing-function:cubic-bezier(.6,0,.3,1)}100%{transform:translate(0px,0px) rotate(-3deg) scale(1,1)}}@keyframes sHead{0%{transform:rotate(-6deg);animation-timing-function:cubic-bezier(.3,1.7,.6,1)}3%{transform:rotate(-10deg)}8%{transform:rotate(-6deg)}12.5%{transform:rotate(-6deg);animation-timing-function:cubic-bezier(.3,1.7,.6,1)}15.5%{transform:rotate(-10deg)}20.5%{transform:rotate(-6deg)}25%{transform:rotate(-6deg);animation-timing-function:cubic-bezier(.3,1.7,.6,1)}28%{transform:rotate(-10deg)}33%{transform:rotate(-6deg)}37.5%{transform:rotate(-6deg);animation-timing-function:cubic-bezier(.3,1.7,.6,1)}40.5%{transform:rotate(-10deg)}45.5%{transform:rotate(-6deg)}50%{transform:rotate(-6deg);animation-timing-function:cubic-bezier(.3,1.7,.6,1)}53%{transform:rotate(-10deg)}58%{transform:rotate(-6deg)}62.5%{transform:rotate(-6deg);animation-timing-function:cubic-bezier(.3,1.7,.6,1)}65.5%{transform:rotate(-10deg)}70.5%{transform:rotate(-6deg)}74%{transform:rotate(-6deg);animation-timing-function:cubic-bezier(.6,0,.3,1)}100%{transform:rotate(-6deg)}}
@keyframes spray{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),40px) scale(1.15)}}</style>
