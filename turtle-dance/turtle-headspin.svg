<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<title>Turtle dancing: headspin</title>
<defs>
<radialGradient id="skin" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#b6ee9f"/><stop offset="1" stop-color="#62bf6f"/></radialGradient>
<radialGradient id="shell" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#5dbb8c"/><stop offset="1" stop-color="#2c7457"/></radialGradient>
<linearGradient id="belly" x2="0" y2="1"><stop offset="0" stop-color="#fff5c8"/><stop offset="1" stop-color="#f4cc76"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#fff3b0" stop-opacity=".7"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient>
<clipPath id="hc"><ellipse cx="120" cy="76" rx="38" ry="32"/></clipPath>
