<style>
.turtle{transform-origin:120px 212px}.torso{transform-origin:120px 190px}.head{transform-origin:120px 106px}
.eyes{transform-origin:120px 80px;animation:blink 4.3s infinite}.joy{opacity:0}
.arm-l{transform-origin:78px 128px;transform:rotate(20deg)}.arm-r{transform-origin:162px 128px;transform:rotate(-20deg)}
.fore-l{transform-origin:78px 144px;transform:rotate(-10deg)}.fore-r{transform-origin:162px 144px;transform:rotate(10deg)}
.leg-l{transform-origin:105px 184px}.leg-r{transform-origin:135px 184px}.shadow{transform-origin:120px 214px}
.bl,.br{opacity:0}
.spark,.note,.drop,.pop{transform-box:fill-box;transform-origin:center;opacity:0}
.spark{animation:twinkle 2s ease-in-out infinite}.note{animation:float 2.8s ease-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@keyframes float{0%{opacity:0;transform:translate(0,6px) rotate(-12deg)}25%{opacity:1}100%{opacity:0;transform:translate(8px,-36px) rotate(14deg)}}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}}
.turtle{transform-origin:120px 150px;animation:hs 3.6s infinite}.shadow{animation:hsSh 3.6s ease-in-out infinite}
.arm-l{animation:hsAL 3.6s ease-in-out infinite}.arm-r{animation:hsAR 3.6s ease-in-out infinite}
.leg-l{animation:hsLL 3.6s ease-in-out infinite}.leg-r{animation:hsLR 3.6s ease-in-out infinite}
.eyes{animation:blink 4.3s infinite,hsEyes 3.6s infinite}.joy{animation:hsJoy 3.6s infinite}
.whoosh{opacity:0;animation:hsW 3.6s infinite}.flick{animation:flick .24s steps(1) infinite}.pop{animation:hsPop 3.6s infinite}
@keyframes hs{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);animation-timing-function:ease-in-out}7%{transform:translate(0px,6px) rotate(0deg) scale(1.08,0.9);animation-timing-function:cubic-bezier(.2,.8,.4,1)}15%{transform:translate(0px,-66px) rotate(-110deg) scale(0.96,1.04);animation-timing-function:cubic-bezier(.6,0,.8,.4)}21%{transform:translate(0px,-44px) rotate(-180deg) scale(1.06,0.94);animation-timing-function:ease-out}24%{transform:translate(0px,-44px) rotate(-180deg) scale(1,1);animation-timing-function:ease-in-out}29%{transform:translate(0px,-44px) rotate(-180deg) scale(-1,1);animation-timing-function:ease-in-out}34%{transform:translate(0px,-46px) rotate(-180deg) scale(1,1);animation-timing-function:ease-in-out}39%{transform:translate(0px,-44px) rotate(-180deg) scale(-1,1);animation-timing-function:ease-in-out}44%{transform:translate(0px,-46px) rotate(-180deg) scale(1,1);animation-timing-function:ease-in-out}49%{transform:translate(0px,-44px) rotate(-180deg) scale(-1,1);animation-timing-function:ease-in-out}54%{transform:translate(0px,-46px) rotate(-180deg) scale(1,1);animation-timing-function:ease-in-out}59%{transform:translate(0px,-44px) rotate(-180deg) scale(-1,1);animation-timing-function:ease-in-out}64%{transform:translate(0px,-46px) rotate(-180deg) scale(1,1);animation-timing-function:ease-in-out}67%{transform:translate(0px,-40px) rotate(-180deg) scale(1.06,0.94);animation-timing-function:cubic-bezier(.2,.8,.4,1)}74%{transform:translate(0px,-72px) rotate(-290deg) scale(0.96,1.04);animation-timing-function:cubic-bezier(.6,0,.8,.4)}81%{transform:translate(0px,5px) rotate(-360deg) scale(1.1,0.9);animation-timing-function:ease-out}85%{transform:translate(0px,-3px) rotate(-360deg) scale(0.97,1.03);animation-timing-function:ease-in-out}88%,100%{transform:translate(0px,0px) rotate(-360deg) scale(1,1)}}
@keyframes hsSh{0%,100%{transform:scale(1)}7%{transform:scale(1.12)}15%{transform:scale(0.5)}21%,64%{transform:scale(0.72)}74%{transform:scale(0.45)}81%{transform:scale(1.14)}88%{transform:scale(1)}}
@keyframes hsAL{0%,100%{transform:rotate(18deg)}7%{transform:rotate(42deg)}15%{transform:rotate(125deg)}24%,64%{transform:rotate(95deg)}67%{transform:rotate(70deg)}74%,81%{transform:rotate(155deg)}86%,96%{transform:rotate(142deg)}}
@keyframes hsAR{0%,100%{transform:rotate(-18deg)}7%{transform:rotate(-42deg)}15%{transform:rotate(-125deg)}24%,64%{transform:rotate(-95deg)}67%{transform:rotate(-70deg)}74%,81%{transform:rotate(-155deg)}86%,96%{transform:rotate(-142deg)}}
@keyframes hsLL{0%,7%,81%,100%{transform:rotate(0deg)}15%{transform:rotate(25deg)}21%,64%{transform:rotate(42deg)}74%{transform:rotate(20deg)}86%,96%{transform:rotate(10deg)}}
@keyframes hsLR{0%,7%,81%,100%{transform:rotate(0deg)}15%{transform:rotate(-25deg)}21%,64%{transform:rotate(-42deg)}74%{transform:rotate(-20deg)}86%,96%{transform:rotate(-10deg)}}
@keyframes hsEyes{0%,83%,98%,100%{opacity:1}84%,97%{opacity:0}}@keyframes hsJoy{0%,83%,98%,100%{opacity:0}84%,97%{opacity:1}}
@keyframes hsW{0%,22%,66%,100%{opacity:0}27%,61%{opacity:.85}}@keyframes flick{50%{opacity:.25}}
@keyframes hsPop{0%,82%{opacity:0;transform:scale(0) rotate(0deg)}87%{opacity:1;transform:scale(1.25) rotate(45deg)}95%{opacity:1;transform:scale(1) rotate(90deg)}100%{opacity:0;transform:scale(.4) rotate(120deg)}}</style>
